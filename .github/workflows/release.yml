# Builds Lidbend.app and publishes it as a GitHub release whenever a version
# tag is pushed:
#
#   git tag v1.0 && git push origin v1.0
#
# The runner has no signing certificate, so the app is ad-hoc signed exactly
# as a local build without --setup-signing would be.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and package
        run: ./build.sh --package

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/Lidbend-*.zip \
            --title "Lidbend ${GITHUB_REF_NAME#v}" \
            --generate-notes
